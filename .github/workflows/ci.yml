name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: static build (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/svngod ./cmd/svnadmin ./cmd/svngocli

      - name: unit tests
        run: CGO_ENABLED=0 go test -count=1 -timeout 15m ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build linux + darwin
        run: |
          CGO_ENABLED=0 GOOS=linux  go build -o /dev/null ./...
          CGO_ENABLED=0 GOOS=darwin go build -o /dev/null ./...
