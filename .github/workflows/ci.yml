name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: static build (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/svngod ./cmd/svnadmin ./cmd/svngocli

      - name: unit tests
        run: CGO_ENABLED=0 go test -count=1 -timeout 15m ./...

      # The unit tests build DAV requests by hand, so they cannot show that
      # ra_serf accepts the answers. This runs the real client.
      - name: install subversion
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install subversion || true
          else
            sudo apt-get update && sudo apt-get install -y subversion
          fi
          svn --version --quiet

      - name: svn client regression
        run: bash scripts/svn-client.sh
        timeout-minutes: 10

  vulncheck:
    # Separate job so a DB/network blip fails here instead of taking the unit
    # tests with it. Installs the tool explicitly: a runner image without
    # govulncheck must not silently drop the scan (VULNCHECK_REQUIRE_TOOL=1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        env:
          VULNCHECK_REQUIRE_TOOL: "1"
        run: bash scripts/vulncheck.sh
        timeout-minutes: 15

  race:
    # The default suite runs CGO_ENABLED=0 (release builds are pure Go and
    # static), and the race detector needs cgo, so it cannot share that job.
    # Worth the extra job: fs and server have real concurrency (group commit,
    # mirror repair, txn cleanup) where a race corrupts data rather than just
    # returning a wrong answer. ~20s on 16 cores.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: CGO_ENABLED=1 go test -race -count=1 -timeout 20m ./...
        timeout-minutes: 30

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build linux + darwin
        run: |
          CGO_ENABLED=0 GOOS=linux  go build -o /dev/null ./...
          CGO_ENABLED=0 GOOS=darwin go build -o /dev/null ./...
